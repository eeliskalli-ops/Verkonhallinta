name: hamk-verkonhallinta-golden

mgmt:
  network: clab-mgmt
  ipv4-subnet: 172.20.20.0/24

topology:

  nodes:

    ####################################################
    # ROUTERS
    ####################################################

    r1:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - ../configs/frr/r1/daemons:/etc/frr/daemons
        - ../configs/frr/r1/frr.conf:/etc/frr/frr.conf
        - ../scripts/router-bootstrap.sh:/usr/local/bin/router-bootstrap.sh
      exec:
        - chmod +x /usr/local/bin/router-bootstrap.sh
        - /usr/local/bin/router-bootstrap.sh r1 10.10.10.0/24 "eth2 eth3" 172.20.20.1
        - /bin/sh -lc 'if command -v apk >/dev/null 2>&1; then apk add --no-cache rsync net-snmp net-snmp-tools rsyslog; elif command -v apt-get >/dev/null 2>&1; then apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y rsync snmp snmpd rsyslog; fi'
        - /bin/sh -lc 'printf "%s\n" "*.* action(type="omfwd" target="172.20.20.50" port="514" protocol="tcp" action.resumeRetryCount="-1" queue.type="linkedList" queue.filename="frr-forward" queue.saveOnShutdown="on")" > /etc/rsyslog.d/50-remote.conf'
        - /bin/sh -lc 'pkill rsyslogd 2>/dev/null || true; rsyslogd'

    r2:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - ../configs/frr/r2/daemons:/etc/frr/daemons
        - ../configs/frr/r2/frr.conf:/etc/frr/frr.conf
        - ../scripts/router-bootstrap.sh:/usr/local/bin/router-bootstrap.sh
      exec:
        - chmod +x /usr/local/bin/router-bootstrap.sh
        - /usr/local/bin/router-bootstrap.sh r2 10.10.20.0/24 "eth2 eth3 eth4" 172.20.20.1
        - /bin/sh -lc 'if command -v apk >/dev/null 2>&1; then apk add --no-cache rsync net-snmp net-snmp-tools rsyslog; elif command -v apt-get >/dev/null 2>&1; then apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y rsync snmp snmpd rsyslog; fi'
        - /bin/sh -lc 'printf "%s\n" "*.* action(type="omfwd" target="172.20.20.50" port="514" protocol="tcp" action.resumeRetryCount="-1" queue.type="linkedList" queue.filename="frr-forward" queue.saveOnShutdown="on")" > /etc/rsyslog.d/50-remote.conf'
        - /bin/sh -lc 'pkill rsyslogd 2>/dev/null || true; rsyslogd'

    r3:
      kind: linux
      image: frrouting/frr:latest
      binds:
        - ../configs/frr/r3/daemons:/etc/frr/daemons
        - ../configs/frr/r3/frr.conf:/etc/frr/frr.conf
        - ../scripts/router-bootstrap.sh:/usr/local/bin/router-bootstrap.sh
      exec:
        - chmod +x /usr/local/bin/router-bootstrap.sh
        - /usr/local/bin/router-bootstrap.sh r3 10.10.30.0/24 "eth2" 172.20.20.1
        - /bin/sh -lc 'if command -v apk >/dev/null 2>&1; then apk add --no-cache rsync net-snmp net-snmp-tools rsyslog; elif command -v apt-get >/dev/null 2>&1; then apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y rsync snmp snmpd rsyslog; fi'
        - /bin/sh -lc 'printf "%s\n" "*.* action(type="omfwd" target="172.20.20.50" port="514" protocol="tcp" action.resumeRetryCount="-1" queue.type="linkedList" queue.filename="frr-forward" queue.saveOnShutdown="on")" > /etc/rsyslog.d/50-remote.conf'
        - /bin/sh -lc 'pkill rsyslogd 2>/dev/null || true; rsyslogd'

    ####################################################
    # L2 BRIDGES
    ####################################################

    srv-bp:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity

    mgmt-bp:
      kind: linux
      image: alpine:latest
      cmd: sleep infinity

    srv-br|srv-bp:
      kind: bridge
      network-mode: container:srv-bp

    mgmt-br|mgmt-bp:
      kind: bridge
      network-mode: container:mgmt-bp

    ####################################################
    # USER NETWORK
    ####################################################

    client1:
      kind: linux
      image: ubuntu:24.04
      binds:
        - ../configs/student-bootstrap:/student-bootstrap
        - ../configs:/configs
      exec:
        - sh -c 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 iputils-ping curl openssh-server traceroute dnsutils tcpdump net-tools mtr-tiny nmap telnet wget'
        - ip addr add 10.10.10.101/24 dev eth1
        - ip route replace default via 10.10.10.1 dev eth1
        - sh -c 'echo "nameserver 10.255.255.254" > /etc/resolv.conf'
        - bash /student-bootstrap/bootstrap.sh

    attacker:
      kind: linux
      image: kalilinux/kali-rolling:latest
      binds:
        - ../configs:/configs
      exec:
        - sh -c 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 iputils-ping openssh-server python3 traceroute dnsutils tcpdump net-tools mtr-tiny nmap telnet wget curl'
        - ip addr add 10.10.10.200/24 dev eth1
        - ip route replace default via 10.10.10.1 dev eth1
        - bash /configs/ssh-setup.sh || true

    ####################################################
    # SERVER NETWORK
    ####################################################

    web1:
      kind: linux
      image: ubuntu:24.04
      binds:
        - ../configs/student-bootstrap:/student-bootstrap
        - ../configs:/configs
      exec:
        - sh -c 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 iputils-ping curl openssh-server traceroute dnsutils tcpdump net-tools mtr-tiny nmap telnet wget'
        - ip addr add 10.10.20.101/24 dev eth1
        - ip route replace default via 10.10.20.1 dev eth1
        - sh -c 'echo "nameserver 10.255.255.254" > /etc/resolv.conf'
        - bash /student-bootstrap/bootstrap.sh

    db1:
      kind: linux
      image: ubuntu:24.04
      binds:
        - ../configs/student-bootstrap:/student-bootstrap
        - ../configs:/configs
      exec:
        - sh -c 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 iputils-ping curl openssh-server traceroute dnsutils tcpdump net-tools mtr-tiny nmap telnet wget'
        - ip addr add 10.10.20.102/24 dev eth1
        - ip route replace default via 10.10.20.1 dev eth1
        - sh -c 'echo "nameserver 10.255.255.254" > /etc/resolv.conf'
        - bash /student-bootstrap/bootstrap.sh

    ####################################################
    # BRANCH OFFICE
    ####################################################

    branch-client:
      kind: linux
      image: ubuntu:24.04
      binds:
        - ../configs:/configs
      exec:
        - sh -c 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y iproute2 iputils-ping openssh-server python3 traceroute dnsutils tcpdump net-tools mtr-tiny nmap telnet wget curl'
        - ip addr add 10.10.30.101/24 dev eth1
        - ip route replace default via 10.10.30.1 dev eth1
        - sh -c 'echo "nameserver 10.255.255.254" > /etc/resolv.conf'
        - bash /configs/ssh-setup.sh

    ####################################################
    # MANAGEMENT SERVICES
    ####################################################

    ansible:
      kind: linux
      image: ubuntu:24.04
      binds:
        - ../configs/ansible:/ansible
        - ../configs:/configs
      exec:
        - bash /ansible/ansible-bootstrap.sh

    prometheus:
      kind: linux
      image: prom/prometheus:latest
      ports:
        - 9090:9090
      binds:
        - ../configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml

    cadvisor:
      kind: linux
      image: gcr.io/cadvisor/cadvisor:v0.49.1
      binds:
        - /:/rootfs:ro
        - /var/run:/var/run:ro
        - /sys:/sys:ro
        - /var/lib/docker/:/var/lib/docker:ro
        - /dev/disk/:/dev/disk:ro

    grafana:
      kind: linux
      image: grafana/grafana:latest
      ports:
        - 3000:3000
      binds:
        - ../configs/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources
        - ../configs/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
        - ../configs/grafana/dashboards:/var/lib/grafana/dashboards

    zabbix:
      kind: linux
      image: zabbix/zabbix-appliance:latest
      ports:
        - 8080:80
        - 10051:10051

    syslog:
      kind: linux
      image: rsyslog/syslog_appliance_alpine
      mgmt-ipv4: 172.20.20.50


  ####################################################
  # LINKS
  ####################################################

  links:

    #
    # R1 <---> R2
    #
    - endpoints: ["r1:eth1", "r2:eth1"]

    #
    # R2 <---> R3
    #
    - endpoints: ["r2:eth4", "r3:eth1"]

    #
    # USER LAN
    #
    - endpoints: ["r1:eth2", "client1:eth1"]
    - endpoints: ["r1:eth3", "attacker:eth1"]

    #
    # SERVER LAN
    #
    - endpoints: ["r2:eth2", "srv-br|srv-bp:eth1"]
    - endpoints: ["web1:eth1", "srv-br|srv-bp:eth2"]
    - endpoints: ["db1:eth1", "srv-br|srv-bp:eth3"]

    #
    # MANAGEMENT LAN
    #
    - endpoints: ["r2:eth3", "mgmt-br|mgmt-bp:eth1"]
    - endpoints: ["ansible:eth1", "mgmt-br|mgmt-bp:eth2"]
    - endpoints: ["prometheus:eth1", "mgmt-br|mgmt-bp:eth3"]
    - endpoints: ["cadvisor:eth1", "mgmt-br|mgmt-bp:eth4"]
    - endpoints: ["grafana:eth1", "mgmt-br|mgmt-bp:eth5"]
    - endpoints: ["zabbix:eth1", "mgmt-br|mgmt-bp:eth6"]
    - endpoints: ["syslog:eth1", "mgmt-br|mgmt-bp:eth7"]

    #
    # BRANCH OFFICE LAN
    #
    - endpoints: ["r3:eth2", "branch-client:eth1"]